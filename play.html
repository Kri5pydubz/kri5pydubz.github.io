<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Streets / Dubzilla — Kri5pydubz</title>
  <meta name="description" content="Neon Streets. Side-scrolling brawler — Dubzilla holds the neon strip. Play free in the browser.">
  <meta name="theme-color" content="#111111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260924play">
  <style>
    body.play-page { min-height: 100vh; display: flex; flex-direction: column; background: #111; }
    body.play-page .site-header { flex-shrink: 0; }
    .play-bar {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem 1.25rem;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid rgba(244,241,234,0.12);
      background: #111;
    }
    .play-bar h1 {
      margin: 0;
      font-family: "Black Ops One", system-ui, sans-serif;
      font-size: clamp(1.15rem, 3vw, 1.6rem);
      color: #F4F1EA;
      letter-spacing: 0.02em;
    }
    .play-bar .hint {
      margin: 0;
      font-size: 0.85rem;
      color: rgba(244,241,234,0.72);
      max-width: 42rem;
    }
    .play-stage-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      background: #0a0a0a;
    }
    .play-stage {
      flex: 1;
      width: 100%;
      min-height: min(78vh, 900px);
      height: calc(100vh - 7.5rem);
      border: 0;
      background: #000;
    }
    @media (max-width: 720px) {
      .play-stage { height: calc(100vh - 9.5rem); min-height: 60vh; }
    }
  </style>
</head>
<body class="play-page">
  <a class="skip" href="#game">Skip to game</a>

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Kri5pydubz home">
      Kri<span class="five">5</span>pydubz
    </a>
    <nav aria-label="Site">
      <a href="index.html#who">Who</a>
      <a href="index.html#when">When</a>
      <a href="index.html#watch">Watch</a>
      <a href="members.html">Members</a>
      <a href="league.html">League</a>
      <a href="merch.html">Merch</a>
      <a href="play.html" aria-current="page">Play</a>
    </nav>
  </header>

  <div class="play-bar">
    <h1>Neon Streets</h1>
    <p class="hint">WASD / arrows · Space jump · J claw · K spin · L breath · G grab · M mute. Tap the game once so keys go there.</p>
  </div>

  <div class="play-stage-wrap">
    <iframe
      id="game"
      class="play-stage"
      title="Neon Streets / Dubzilla"
      src="play/index.html"
      allow="fullscreen; gamepad; autoplay"
      allowfullscreen
      loading="eager"
      referrerpolicy="same-origin"
    ></iframe>
  </div>
</body>
</html>
