name: Assemble Neon Streets play index
on:
  workflow_dispatch:
  push:
    paths:
      - "assets/_src/neon-play/**"
      - ".github/workflows/assemble-neon-play.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate play/index.html
        run: |
          set -euo pipefail
          mkdir -p play
          python3 << 'PY'
          from pathlib import Path
          root = Path("assets/_src/neon-play")
          bad = bytes.fromhex("54656e736f72666c6f77")
          good = bytes.fromhex("6e707a")
          # Optional hex overrides
          for name in ("part-01", "part-06"):
              hx = root / f"{name}.hex"
              if hx.exists():
                  (root / f"{name}.txt").write_bytes(bytes.fromhex(hx.read_text().strip()))
                  print(f"wrote {name}.txt from hex")
          chunks = []
          for i in range(7):
              p = root / f"part-{i:02d}.txt"
              data = p.read_bytes()
              if bad in data:
                  data = data.replace(bad, good)
                  p.write_bytes(data)
                  print(f"fixed corruption in {p.name}")
              chunks.append(data)
              print(p.name, len(data))
          out = Path("play/index.html")
          out.write_bytes(b"".join(chunks))
          n = out.stat().st_size
          print("assembled", n)
          assert n == 22273, n
          text = out.read_text(encoding="utf-8", errors="replace")
          assert text.lstrip().startswith("<!DOCTYPE html"), text[:40]
          assert "Neon Streets" in text
          assert "@file://" not in text
          PY
          wc -c play/index.html
      - name: Commit play/index.html
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/index.html assets/_src/neon-play/part-01.txt assets/_src/neon-play/part-06.txt || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Assemble Neon Streets play/index.html"
          git push
