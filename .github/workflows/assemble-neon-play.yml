name: Assemble Neon Streets play index
on:
  workflow_dispatch:
  push:
    paths:
      - "assets/_src/neon-play/**"
      - ".github/workflows/assemble-neon-play.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate play/index.html
        run: |
          set -euo pipefail
          mkdir -p play
          cat assets/_src/neon-play/part-*.txt > play/index.html
          wc -c play/index.html
          test "$(wc -c < play/index.html)" -eq 22273
          head -c 15 play/index.html | grep -q '<!DOCTYPE html'
          grep -q 'Neon Streets' play/index.html
          ! grep -q '@file://' play/index.html
      - name: Commit play/index.html
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/index.html
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Assemble Neon Streets play/index.html"
          git push
